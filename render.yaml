# Render Blueprint: creates the web app and its PostgreSQL database in one go.
# In Render: New > Blueprint > pick your GitHub repo.
services:
  - type: web
    name: ding-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_USERNAME    # the owner account's username
        value: yoorange
      - key: DATABASE_URL
        fromDatabase:
          name: ding-db
          property: connectionString

databases:
  - name: ding-db
    plan: free
    databaseName: ding
    user: ding
